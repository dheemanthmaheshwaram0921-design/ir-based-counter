<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Visitor Counter | 3D Interactive Circuit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      color: #f3f4f6;
      touch-action: none;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* INITIAL SPLASH OVERLAY */
    #landing-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      background: radial-gradient(circle at center, #0b1329 0%, #030712 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s;
    }

    .brand-logo {
      font-size: 22px;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 300;
      color: #93c5fd;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(147, 197, 253, 0.4);
    }

    .brand-sub {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 40px;
    }

    .enter-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(147, 197, 253, 0.3);
      color: #e0f2fe;
      padding: 14px 28px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.4s ease;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
    }

    .enter-btn:hover {
      background: rgba(147, 197, 253, 0.15);
      border-color: #93c5fd;
      box-shadow: 0 0 25px rgba(147, 197, 253, 0.3);
      transform: translateY(-2px);
    }

    /* MAIN APP UI */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .interactive { pointer-events: auto; }

    header {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    h1 { font-size: 14px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #93c5fd; }

    .counter-display {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .counter-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #9ca3af; }
    .counter-value { font-size: 20px; font-weight: 700; color: #38bdf8; font-family: monospace; }

    /* FLOATING INFO DRAWER */
    #info-panel {
      position: absolute;
      right: 24px;
      top: 90px;
      width: calc(100% - 48px);
      max-width: 320px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(147, 197, 253, 0.2);
      border-radius: 12px;
      padding: 20px;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    #info-panel.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    #info-panel h2 { font-size: 15px; font-weight: 500; color: #38bdf8; margin-bottom: 8px; letter-spacing: 1px; }
    #info-panel p { font-size: 12px; line-height: 1.6; color: #d1d5db; }
    #info-panel .specs { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 11px; color: #9ca3af; }

    /* CONTROLS BAR */
    .controls-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn {
      background: rgba(30, 58, 138, 0.4);
      border: 1px solid rgba(147, 197, 253, 0.3);
      color: #f3f4f6;
      padding: 12px 20px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .btn:hover { background: rgba(59, 130, 246, 0.4); border-color: #93c5fd; }
    .btn-secondary { background: rgba(17, 24, 39, 0.6); border-color: rgba(255, 255, 255, 0.1); }

    .instructions {
      text-align: center;
      font-size: 10px;
      letter-spacing: 1px;
      color: #6b7280;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      #info-panel { top: auto; bottom: 90px; right: 24px; left: 24px; width: auto; max-width: none; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="landing-overlay">
    <div class="brand-logo">Smart Counter Circuit</div>
    <div class="brand-sub">Interactive 3D Simulation</div>
    <button id="enter-btn" class="enter-btn">Enter Experience</button>
  </div>

  <div id="webgl-container"></div>

  <div id="ui-container">
    <header class="interactive">
      <h1>Smart Counter</h1>
      <div class="counter-display">
        <span class="counter-label">Count:</span>
        <span id="counter" class="counter-value">00</span>
      </div>
    </header>

    <div id="info-panel" class="interactive">
      <h2 id="panel-title">Component Focus</h2>
      <p id="panel-desc">Tap elements in the 3D space to inspect their functions.</p>
      <div id="panel-specs" class="specs">System Mode: Operational</div>
    </div>

    <div class="instructions">Drag to orbit • Pinch to zoom • Tap components to inspect</div>

    <div class="controls-bar interactive">
      <button id="btn-pass" class="btn">Pass Student</button>
      <button id="btn-reset" class="btn btn-secondary">Reset View</button>
    </div>
  </div>

  <script>
    // --- AUDIO SYSTEM (Web Audio API Synthesizer) ---
    class AtmosphericAudio {
      constructor() { this.ctx = null; }
      init() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.createDrone();
      }
      createDrone() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(55, this.ctx.currentTime); // Low A drone
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
      }
      playPing(freq = 880) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.8);
      }
    }
    const audio = new AtmosphericAudio();

    // --- THREE.JS SCENE SETUP ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    const startCamPos = { x: 0, y: 15, z: 25 };
    const defaultCamPos = { x: 0, y: 4, z: 10 };
    camera.position.set(startCamPos.x, startCamPos.y, startCamPos.z);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;
    controls.target.set(0, 1.2, 0);
    controls.enabled = false;

    // --- LIGHTING & ATMOSPHERE ---
    scene.add(new THREE.AmbientLight(0x38bdf8, 0.4));

    const spotLight = new THREE.SpotLight(0x38bdf8, 3, 20, Math.PI / 3, 0.5);
    spotLight.position.set(0, 8, 0);
    scene.add(spotLight);

    // Dynamic Floating Dust Particles
    const particleGeo = new THREE.BufferGeometry();
    const particleCount = 200;
    const posArray = new Float32Array(particleCount * 3);
    for(let i=0; i<particleCount*3; i+=3) {
      posArray[i] = (Math.random() - 0.5) * 15;
      posArray[i+1] = Math.random() * 6;
      posArray[i+2] = (Math.random() - 0.5) * 15;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particleMat = new THREE.PointsMaterial({ size: 0.03, color: 0x38bdf8, transparent: true, opacity: 0.5 });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // --- ENVIRONMENT & DOORWAY CIRCUIT ---
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x030712, roughness: 0.9, metalness: 0.1 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const grid = new THREE.GridHelper(30, 30, 0x1e293b, 0x0f172a);
    grid.position.y = 0.01;
    scene.add(grid);

    // Frame Pillars
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.8 });
    const pillarGeo = new THREE.BoxGeometry(0.2, 3, 0.3);
    
    const leftPillar = new THREE.Mesh(pillarGeo, frameMat);
    leftPillar.position.set(-1.8, 1.5, 0);
    scene.add(leftPillar);

    const rightPillar = new THREE.Mesh(pillarGeo, frameMat);
    rightPillar.position.set(1.8, 1.5, 0);
    scene.add(rightPillar);

    const topLintel = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.2, 0.3), frameMat);
    topLintel.position.set(0, 3, 0);
    scene.add(topLintel);

    // --- INTERACTIVE COMPONENTS ---
    const interactiveObjects = [];

    function createSensorNode(x, y, z, title, desc, specs) {
      const group = new THREE.Group();
      group.position.set(x, y, z);

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 0.12, 16),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.6 })
      );
      body.rotation.z = Math.PI / 2;
      group.add(body);

      const hitMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.35),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitMesh.userData = { title, desc, specs, targetPos: new THREE.Vector3(x, y, z) };
      group.add(hitMesh);
      interactiveObjects.push(hitMesh);

      scene.add(group);
    }

    createSensorNode(-1.6, 1.2, -0.3, "IR Emitter Diode A", "Emits continuous infrared light beam across primary entry boundary.", "Component: GaAs IR LED | 940nm");
    createSensorNode(1.6, 1.2, -0.3, "Photodiode Receiver A", "Detects beam breakage at Beam A. Signals initial step of student entry.", "Component: High-Speed Photodiode");
    createSensorNode(-1.6, 1.2, 0.3, "IR Emitter Diode B", "Secondary beam line. Confirms sequence direction.", "Component: GaAs IR LED | 940nm");
    createSensorNode(1.6, 1.2, 0.3, "Photodiode Receiver B", "Triggers digital counter increment when interrupted after Receiver A.", "Component: High-Speed Photodiode");

    // IR Beams
    function createBeam(z) {
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.006, 0.006, 3.1, 8),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 })
      );
      beam.rotation.z = Math.PI / 2;
      beam.position.set(0, 1.2, z);
      scene.add(beam);
      return beam;
    }
    const beamA = createBeam(-0.3);
    const beamB = createBeam(0.3);

    // Logic Controller Unit
    const mcuGroup = new THREE.Group();
    mcuGroup.position.set(1.9, 1.8, 0);
    const mcuBox = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.4, 0.25),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.9 })
    );
    mcuGroup.add(mcuBox);

    const mcuHit = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.4), new THREE.MeshBasicMaterial({ visible: false }));
    mcuHit.userData = {
      title: "Microcontroller Unit",
      desc: "Processes analog photodiode inputs to track direction and update counter logic.",
      specs: "MCU: ATmega328P / Logic State Machine",
      targetPos: new THREE.Vector3(1.9, 1.8, 0)
    };
    mcuGroup.add(mcuHit);
    interactiveObjects.push(mcuHit);
    scene.add(mcuGroup);

    // --- STUDENT MODEL ---
    const studentGroup = new THREE.Group();
    const studentBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2, 0.15, 0.9, 16),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 })
    );
    studentBody.position.y = 0.85;
    studentGroup.add(studentBody);

    const studentHead = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xe0f2fe })
    );
    studentHead.position.y = 1.4;
    studentGroup.add(studentHead);

    studentGroup.position.set(0, 0, -3.5);
    scene.add(studentGroup);

    // --- INTERACTION & ANIMATIONS ---
    let studentCount = 0;
    let isAnimating = false;

    document.getElementById('enter-btn').addEventListener('click', () => {
      audio.init();
      audio.playPing(440);

      const overlay = document.getElementById('landing-overlay');
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';

      document.getElementById('ui-container').style.opacity = '1';

      // Cinematic Zoom-In Sequence
      gsap.to(camera.position, {
        x: defaultCamPos.x,
        y: defaultCamPos.y,
        z: defaultCamPos.z,
        duration: 2.5,
        ease: "power3.inOut",
        onComplete: () => { controls.enabled = true; }
      });
    });

    function triggerStudentPass() {
      if (isAnimating) return;
      isAnimating = true;
      studentGroup.position.set(0, 0, -3.5);

      const timeline = gsap.timeline({
        onComplete: () => {
          isAnimating = false;
          studentGroup.position.set(0, 0, -3.5);
        }
      });

      timeline.to(studentGroup.position, {
        z: -0.3,
        duration: 1.2,
        ease: "power1.inOut",
        onUpdate: checkBeams
      });

      timeline.to(studentGroup.position, {
        z: 3.5,
        duration: 1.5,
        ease: "power1.inOut",
        onUpdate: checkBeams
      });
    }

    function checkBeams() {
      const z = studentGroup.position.z;

      if (Math.abs(z - (-0.3)) < 0.2) {
        beamA.material.color.setHex(0x38bdf8);
        beamA.material.opacity = 1.0;
      } else {
        beamA.material.color.setHex(0x38bdf8);
        beamA.material.opacity = 0.4;
      }

      if (Math.abs(z - 0.3) < 0.2) {
        beamB.material.color.setHex(0x38bdf8);
        beamB.material.opacity = 1.0;

        if (!studentGroup.userData.hasCounted) {
          studentCount++;
          document.getElementById('counter').innerText = String(studentCount).padStart(2, '0');
          studentGroup.userData.hasCounted = true;
          audio.playPing(1200);
          gsap.to(mcuBox.material.color, { r: 0.2, g: 0.8, b: 1, duration: 0.1, yoyo: true, repeat: 1 });
        }
      } else {
        beamB.material.color.setHex(0x38bdf8);
        beamB.material.opacity = 0.4;
      }

      if (z < -0.5) studentGroup.userData.hasCounted = false;
    }

    // Raycasting Inspection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if (e.target.closest('.interactive')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const target = intersects[0].object;
        focusOn(target);
      }
    });

    function focusOn(target) {
      const data = target.userData;
      const targetPos = data.targetPos;
      audio.playPing(600);

      gsap.to(camera.position, {
        x: targetPos.x + (targetPos.x > 0 ? 1.0 : -1.0),
        y: targetPos.y + 0.2,
        z: targetPos.z + 1.5,
        duration: 1.4,
        ease: "power2.inOut"
      });

      gsap.to(controls.target, {
        x: targetPos.x,
        y: targetPos.y,
        z: targetPos.z,
        duration: 1.4,
        ease: "power2.inOut"
      });

      document.getElementById('panel-title').innerText = data.title;
      document.getElementById('panel-desc').innerText = data.desc;
      document.getElementById('panel-specs').innerText = data.specs;
      document.getElementById('info-panel').classList.add('active');
    }

    function resetView() {
      audio.playPing(400);
      gsap.to(camera.position, {
        x: defaultCamPos.x,
        y: defaultCamPos.y,
        z: defaultCamPos.z,
        duration: 1.4,
        ease: "power2.inOut"
      });

      gsap.to(controls.target, {
        x: 0,
        y: 1.2,
        z: 0,
        duration: 1.4,
        ease: "power2.inOut"
      });

      document.getElementById('info-panel').classList.remove('active');
    }

    document.getElementById('btn-pass').addEventListener('click', triggerStudentPass);
    document.getElementById('btn-reset').addEventListener('click', resetView);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.0005;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

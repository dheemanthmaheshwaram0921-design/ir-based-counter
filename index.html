<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Smart Visitor Counter Circuit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      color: #e6edf3;
      touch-action: none;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Overlay Container */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .interactive {
      pointer-events: auto;
    }

    header {
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      gap: 10px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #58a6ff;
    }

    .counter-display {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(88, 166, 255, 0.3);
      white-space: nowrap;
    }

    .counter-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #8b949e;
      letter-spacing: 0.5px;
    }

    .counter-value {
      font-size: 20px;
      font-weight: 700;
      color: #3fb950;
      font-family: monospace;
    }

    /* Info Panel */
    #info-panel {
      position: absolute;
      right: 16px;
      top: 80px;
      width: calc(100% - 32px);
      max-width: 320px;
      background: rgba(22, 27, 34, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      transform: translateY(-20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    #info-panel.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    #info-panel h2 {
      font-size: 15px;
      color: #58a6ff;
      margin-bottom: 6px;
    }

    #info-panel p {
      font-size: 12px;
      line-height: 1.5;
      color: #c9d1d9;
    }

    #info-panel .specs {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      color: #8b949e;
    }

    /* Bottom Action Controls */
    .controls-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
      width: 100%;
    }

    .btn {
      background: linear-gradient(180deg, #238636 0%, #2ea043 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
      transition: all 0.2s ease;
      flex: 1;
      max-width: 200px;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: rgba(33, 38, 45, 0.85);
      border: 1px solid rgba(240, 246, 252, 0.1);
      color: #c9d1d9;
      box-shadow: none;
    }

    .tooltip {
      text-align: center;
      margin-bottom: 6px;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: #8b949e;
      align-self: center;
    }

    /* Media Queries for Mobile Screens */
    @media (max-width: 600px) {
      h1 {
        font-size: 13px;
      }
      .counter-value {
        font-size: 18px;
      }
      #info-panel {
        top: auto;
        bottom: 80px;
        right: 16px;
        left: 16px;
        width: auto;
        max-width: none;
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="webgl-container"></div>

  <div id="ui-container">
    <header class="interactive">
      <h1>Smart Doorstep Counter</h1>
      <div class="counter-display">
        <span class="counter-label">Count:</span>
        <span id="counter" class="counter-value">00</span>
      </div>
    </header>

    <div id="info-panel" class="interactive">
      <h2 id="panel-title">Component Title</h2>
      <p id="panel-desc">Tap on any component in the scene to inspect details.</p>
      <div id="panel-specs" class="specs">Role: Directional Detection</div>
    </div>

    <div class="tooltip">Tap parts to inspect • Drag/pinch to rotate & zoom</div>

    <div class="controls-bar interactive">
      <button id="btn-pass" class="btn">Pass Student</button>
      <button id="btn-reset-cam" class="btn btn-secondary">Reset View</button>
    </div>
  </div>

  <script>
    // --- 1. SCENE SETUP ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e14);
    scene.fog = new THREE.FogExp2(0x0a0e14, 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;
    controls.minDistance = 2;
    controls.maxDistance = 20;
    controls.target.set(0, 1.2, 0);

    // Dynamic Camera Distance Based on Device Screen Ratio
    function getResponsiveCamPos() {
      const isMobile = window.innerWidth < 600 || window.innerHeight > window.innerWidth;
      return isMobile 
        ? { x: 0, y: 6, z: 13 }   // Further back on portrait phones
        : { x: 0, y: 5, z: 9 };    // Standard view on laptops
    }

    let initialCamPos = getResponsiveCamPos();
    camera.position.set(initialCamPos.x, initialCamPos.y, initialCamPos.z);

    // --- 2. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // --- 3. ENVIRONMENT & DOORWAY ---
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8, metalness: 0.2 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(30, 30, 0x1f2937, 0x111827);
    grid.position.y = 0.01;
    scene.add(grid);

    const frameMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.5, metalness: 0.8 });
    const pillarGeo = new THREE.BoxGeometry(0.3, 3, 0.4);
    
    const leftPillar = new THREE.Mesh(pillarGeo, frameMat);
    leftPillar.position.set(-1.8, 1.5, 0);
    leftPillar.castShadow = true;
    scene.add(leftPillar);

    const rightPillar = new THREE.Mesh(pillarGeo, frameMat);
    rightPillar.position.set(1.8, 1.5, 0);
    rightPillar.castShadow = true;
    scene.add(rightPillar);

    const topLintel = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.3, 0.4), frameMat);
    topLintel.position.set(0, 3, 0);
    scene.add(topLintel);

    // --- 4. ELECTRONIC COMPONENTS ---
    const interactiveObjects = [];

    function createSensorNode(x, y, z, label, info) {
      const group = new THREE.Group();
      group.position.set(x, y, z);

      const bracket = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.15, 0.15),
        new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.9 })
      );
      group.add(bracket);

      const isIR = label.includes("IR");
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 0.1, 16),
        new THREE.MeshStandardMaterial({ 
          color: isIR ? 0xef4444 : 0x10b981, 
          emissive: isIR ? 0x991b1b : 0x065f46,
          emissiveIntensity: 0.5
        })
      );
      body.rotation.z = Math.PI / 2;
      group.add(body);

      // Hitbox for raycasting
      const hitMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.3),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitMesh.userData = { title: label, desc: info.desc, specs: info.specs, targetPos: new THREE.Vector3(x, y, z) };
      group.add(hitMesh);
      interactiveObjects.push(hitMesh);

      scene.add(group);
    }

    createSensorNode(-1.6, 1.2, -0.3, "IR Emitter Diode A", {
      desc: "Emits an infrared beam across the entrance to Photodiode A.",
      specs: "Component: IR LED | Wavelength: 940nm"
    });
    createSensorNode(1.6, 1.2, -0.3, "Photodiode Receiver A", {
      desc: "Detects IR light from Emitter A. Breaking this beam first signals entry initiation.",
      specs: "Component: Photodiode / IR Receiver"
    });
    createSensorNode(-1.6, 1.2, 0.3, "IR Emitter Diode B", {
      desc: "Secondary IR beam line for directional sensing.",
      specs: "Component: IR LED | Wavelength: 940nm"
    });
    createSensorNode(1.6, 1.2, 0.3, "Photodiode Receiver B", {
      desc: "Detects IR light from Emitter B. Sequential trigger (A -> B) registers student entry.",
      specs: "Component: Photodiode / IR Receiver"
    });

    // IR Beams
    function createBeam(zPos) {
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.008, 0.008, 3.1, 8),
        new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.4 })
      );
      beam.rotation.z = Math.PI / 2;
      beam.position.set(0, 1.2, zPos);
      scene.add(beam);
      return beam;
    }
    const beamA = createBeam(-0.3);
    const beamB = createBeam(0.3);

    // MCU Box
    const mcuGroup = new THREE.Group();
    mcuGroup.position.set(1.9, 1.8, 0);
    const mcuBox = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.4, 0.3),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.8 })
    );
    mcuGroup.add(mcuBox);

    const mcuHit = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.5, 0.4),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    mcuHit.userData = {
      title: "Microcontroller Unit & Logic Circuit",
      desc: "Processes signals from Photodiodes A & B to determine movement direction and increment count.",
      specs: "Logic: Dual IC Counter / ATmega328P"
    };
    mcuHit.userData.targetPos = new THREE.Vector3(1.9, 1.8, 0);
    mcuGroup.add(mcuHit);
    interactiveObjects.push(mcuHit);
    scene.add(mcuGroup);

    // --- 5. STUDENT MODEL ---
    const studentGroup = new THREE.Group();
    const bodyMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25, 0.2, 0.9, 16),
      new THREE.MeshStandardMaterial({ color: 0x2563eb })
    );
    bodyMesh.position.y = 0.85;
    studentGroup.add(bodyMesh);

    const headMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xfbcfe8 })
    );
    headMesh.position.y = 1.45;
    studentGroup.add(headMesh);

    studentGroup.position.set(0, 0, -3.5);
    scene.add(studentGroup);

    // --- 6. ANIMATION & TOUCH LOGIC ---
    let studentCount = 0;
    let isAnimating = false;

    function triggerStudentPass() {
      if (isAnimating) return;
      isAnimating = true;

      studentGroup.position.set(0, 0, -3);

      const timeline = gsap.timeline({
        onComplete: () => {
          isAnimating = false;
          studentGroup.position.set(0, 0, -3.5);
        }
      });

      timeline.to(studentGroup.position, {
        z: -0.3,
        duration: 1.2,
        ease: "power1.inOut",
        onUpdate: checkBeamIntersections
      });

      timeline.to(studentGroup.position, {
        z: 3,
        duration: 1.5,
        ease: "power1.inOut",
        onUpdate: checkBeamIntersections
      });
    }

    function checkBeamIntersections() {
      const z = studentGroup.position.z;

      if (Math.abs(z - (-0.3)) < 0.2) {
        beamA.material.color.setHex(0xffff00);
        beamA.material.opacity = 0.9;
      } else {
        beamA.material.color.setHex(0xef4444);
        beamA.material.opacity = 0.4;
      }

      if (Math.abs(z - 0.3) < 0.2) {
        beamB.material.color.setHex(0xffff00);
        beamB.material.opacity = 0.9;

        if (!studentGroup.userData.hasCounted) {
          studentCount++;
          document.getElementById('counter').innerText = String(studentCount).padStart(2, '0');
          studentGroup.userData.hasCounted = true;
          gsap.to(mcuBox.material.color, { r: 0, g: 1, b: 0, duration: 0.1, yoyo: true, repeat: 1 });
        }
      } else {
        beamB.material.color.setHex(0xef4444);
        beamB.material.opacity = 0.4;
      }

      if (z < -0.5) studentGroup.userData.hasCounted = false;
    }

    // Touch and Click Handling
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function handleInteraction(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const target = intersects[0].object;
        focusOnObject(target);
      }
    }

    window.addEventListener('click', (e) => {
      if (e.target.closest('.interactive')) return;
      handleInteraction(e.clientX, e.clientY);
    });

    function focusOnObject(target) {
      const data = target.userData;
      const targetPos = data.targetPos;

      gsap.to(camera.position, {
        x: targetPos.x + (targetPos.x > 0 ? 1.2 : -1.2),
        y: targetPos.y + 0.3,
        z: targetPos.z + 1.8,
        duration: 1.2,
        ease: "power2.inOut"
      });

      gsap.to(controls.target, {
        x: targetPos.x,
        y: targetPos.y,
        z: targetPos.z,
        duration: 1.2,
        ease: "power2.inOut"
      });

      document.getElementById('panel-title').innerText = data.title;
      document.getElementById('panel-desc').innerText = data.desc;
      document.getElementById('panel-specs').innerText = data.specs;
      document.getElementById('info-panel').classList.add('active');
    }

    function resetCamera() {
      initialCamPos = getResponsiveCamPos();
      gsap.to(camera.position, {
        x: initialCamPos.x,
        y: initialCamPos.y,
        z: initialCamPos.z,
        duration: 1.2,
        ease: "power2.inOut"
      });

      gsap.to(controls.target, {
        x: 0,
        y: 1.2,
        z: 0,
        duration: 1.2,
        ease: "power2.inOut"
      });

      document.getElementById('info-panel').classList.remove('active');
    }

    document.getElementById('btn-pass').addEventListener('click', triggerStudentPass);
    document.getElementById('btn-reset-cam').addEventListener('click', resetCamera);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      initialCamPos = getResponsiveCamPos();
    });

    // --- 7. RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
